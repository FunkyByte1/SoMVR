# The VR-safe CPU lane's settings (som-b35-lane, docs/re-xr-pipeline.md 163). scripts/lane_install.sh install copies
# this file to ~/.config/somvr-lane/lane.conf (the installed copy wins; edit that one); the environment wins over both.
# Shell syntax, KEY=VALUE, read by scripts/lane_run.sh and scripts/lane_watch.py.
#
# The PC: a Ryzen 7 5800X - 8 cores, SMT siblings N and N+8, one 32 MB L3 for all eight (lscpu -e). The lane takes
# whole cores (both siblings) so a lane job never shares a core with a game thread; the L3 and the memory bandwidth
# stay shared (no per-lane L3 or bandwidth limit without root: resctrl, docs 163.6).
# Cores 0 and 2 are the two the firmware ranks lowest (acpi_cppc highest_perf 171 and 166; cores 3 and 5 are 196, the
# scheduler's first picks for the game's busy threads).
LANE_CPUS=0,2,8,10
# The game, its Monado/WiVRn: every other logical CPU (lane_watch.py pins them there while a lane job runs beside a
# session it protects, and gives them back after).
GAME_CPUS=1,3-7,9,11-15
# The slice's CPU limit (systemd CPUQuota: 100% = one logical CPU) and its period (short = no 100 ms bursts).
LANE_QUOTA=200%
LANE_QUOTA_PERIOD=10ms
LANE_MEMORY_HIGH=6G
LANE_MEMORY_MAX=10G
# Lane jobs while the user is in VR (som-b37-lane2, docs 163.7): 0 = none (the lane frozen for the whole session: the
# old rule); 1 = the jobs named in LANE_VR_JOBS, the rest wait for the session's end (lane_run.sh) or are frozen one by
# one (lane_watch.py). Measured on a 90 Hz stand-in session (docs 163.5-163.6): the builds are within the idle noise
# (interval p99 and missed frames); the speech models (STT, TTS) widen the interval p99 by 0.9-1.5 ms in every setup
# tried (4, 2 or 1 threads, back to back or a note every 20 s, one CPU's quota) without more missed frames - not free by
# the rule: in VR only under the closed loop (LANE_VR_GUARDED).
LANE_IN_VR=1
# The job names (lane.sh run NAME / LANE_NAME; glob patterns, space separated; `all`) free in VR: the builds - the live
# loop's patch build (live_lane.sh's `live-build`), a worker's checks through `lane.sh run check -- ./build.sh --check`.
LANE_VR_JOBS="*build* *check*"
# Jobs that may run in VR only under the closed loop, i.e. while the session writes its frames (SOMVR_PERF_RAW in the
# session's env): the live loop's speech workers - their cost is a wider frame-time spread, not late frames (163.6), and
# the loop freezes them at the first late frames (b37 live3: only late frames plausibly the lane's, 163.10). Without
# the session's frames - none yet, or stopped for 3 s (a hot reload truncated the file under build 37) - they follow
# LANE_VR_NEED_FRAMES like the free jobs (b37 live3, 163.11; before: they waited, and the player's notes with them).
LANE_VR_GUARDED="live-stt live-tts"
# The closed loop in VR: late = pause on late frames only (an interval over LANE_LATE_X x the median: what the headset
# shows); work = also on the render thread's work rising (it starves even the free builds: 163.6). It needs the
# session's frames (SOMVR_PERF_RAW): LANE_VR_NEED_FRAMES=0 lets LANE_VR_JOBS and LANE_VR_GUARDED run without them,
# 1 holds every job in VR until the session writes them.
LANE_VR_LOOP=late
LANE_VR_NEED_FRAMES=0
# The lane's CPU limit while the user is in VR (cpu.max; e.g. 100% = one CPU's time). Unset = LANE_QUOTA (the builds
# were measured free at 200%).
#LANE_VR_QUOTA=100%
# The closed loop (lane_watch.py): a pause when the last 0.5 s of frames' median work is over the baseline's p90, or
# when more frames than the baseline's own rate came late (an interval over LANE_LATE_X x the baseline's median
# interval); a resume after LANE_CALM_S calm seconds (doubled after a pause within 10 s of a resume, up to 60 s).
LANE_CALM_S=3
LANE_LATE_X=1.5
# A short re-measure of the baseline (the lane frozen for 2 s) after this many seconds of lane work (0 = never)
LANE_REBASE_S=60
# b37 live3 (docs 163.10): late frames hold the lane only when it plausibly made them - the seconds with a burst while
# it works against those while it is frozen or idle (a GPU-bound 120 Hz session is late as often either way: never
# held for it); 0 = the rule before (every burst holds it, the calm doubling to 60 s)
LANE_ATTRIB=1
# the lane counts as working only above this share of one CPU (its cgroup's cpu.stat over 0.5 s): idle workers are calm
LANE_ACTIVE_PCT=5
