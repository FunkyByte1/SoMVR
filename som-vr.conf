# som-vr.conf - your switches for Shadow of Mordor VR (PLAY.md, "Turning things off").
#
# How to use it: remove the "#" at the start of a setting's line and change the value after "=". Save the file, then
# start the game. Put the "#" back (or delete the line) to get the normal setting again. Nothing here is needed:
# with every line starting with "#" you get VR build 3 as it was tested.
#
# Only the settings listed below are read, and only the values shown for each. A line with a typo is skipped (the
# rest still works) and logs/som-vr.log says which line and why. Everything after a "#" on a line is a comment.
# This file is read only when the game starts in VR; flat play never looks at it.
# The wrist menu (below) saves its own choices; for a setting you changed there, the menu's choice wins over this file.

# ---- the big switches ------------------------------------------------------------------------------------------------

# First person: you see from Talion's eyes. camera = the earlier view from the game's own camera behind Talion
# (it moves on its own when the game camera swings). head (normal), camera
# SOMVR_BASE=camera

# Talion's arms and sword follow your controllers. 0 = his arms move as in the flat game. 1 (normal), 0
# SOMVR_ARMS=0

# Swinging the sword hits orcs. 0 = swings don't hit. (The controllers never press the game's own attack buttons, so
# to fight the normal way also turn the controllers off below and play with a gamepad.) 1 (normal), 0
# SOMVR_COMBAT=0

# The Quest controllers: walking, turning, buttons, the arms, the sword, the laser pointer. 0 = all of that off: play
# with a gamepad or keyboard and mouse while you look around in the headset. 1 (normal), 0
# SOMVR_INPUT=0

# Hiding Talion's own head so you don't see the inside of it (first person only).
# near (normal), parts (the head, hood and hair not drawn in your eyes, their shadow kept; new, not tried in the
# headset yet), parts+near, bone+near, bone, off
# SOMVR_HIDE_HEAD=off

# The health bar, mini-map and markers on a panel in front of you. off = they show on the monitor only. quad (normal), off
# SOMVR_HUD=off

# Where the HUD panel is: world = put in front of you at the start and then stays there (normal); head = always in
# front of your eyes, moves with your head; off = no panel. world, head, off
# SOMVR_XR_HUD=head

# The laser pointer for menus. 1 = on the big menu screen (normal); hud = also on the HUD panel (the pause menu and the
# map in the world; untested); 0 = off (use the stick and A). 1, hud, 0
# SOMVR_POINTER=hud

# How the laser looks: on = a dot and a ray (normal), dot = only the dot, off = nothing drawn. on, dot, off
# SOMVR_XR_POINTER=dot

# Sounds come from where they are in the world as you turn your head. off = as in the flat game. head (normal), off
# SOMVR_AUDIO=off

# The wrist menu: turn your left palm toward your face for half a second (or hold the left menu button) and a small
# settings panel appears on your wrist; point at it with the right hand. 0 = no wrist menu. 1 (normal), 0
# SOMVR_VRMENU=0

# What you see around the game's menus and loading screens: on = a calm dusk sky (normal); world = the last view of
# the world, dimmed; off = black. on, world, off
# SOMVR_XR_ENV=off

# When the game moves its camera by itself (cutscenes, some finishers), you watch from behind Talion until it is over.
# off = always first person (then those camera moves reach your view). auto (normal), off
# SOMVR_FALLBACK=off

# ---- turning and walking ---------------------------------------------------------------------------------------------

# Right stick: snap = turns in steps (normal), smooth = turns smoothly. snap, smooth
# SOMVR_TURN=smooth

# The size of a snap turn, in degrees (normal 30). 1 to 180
# SOMVR_SNAP_DEG=45

# The speed of a smooth turn, in degrees a second (normal 120). 10 to 360
# SOMVR_TURN_DPS=90

# Left stick: head = walk toward where you look (normal), hand = toward where your left controller points. head, hand
# SOMVR_MOVE=hand

# Walking around your room moves Talion along with you. 0 = only your view moves (normal). 0, 1
# SOMVR_FOLLOW=1

# Walking with the left stick: 1 = you start at once, stop at once and move as fast as you push (normal); 0 = the game's
# own walking (a slow start, a slide when you stop). 1 (normal), 0
# SOMVR_LOCO=0

# Your eyes in first person: root = a steady view that does not bob or lurch with Talion's animations (normal);
# head = the view follows his head exactly (it bobs while running). root (normal), head
# SOMVR_ANCHOR=head

# How far your eyes sit in front of Talion's head, in cm, so that his own face, teeth and hood never float in your
# view. More = further forward. 16 (normal), -30 to 40
# SOMVR_EYE_FWD_CM=16

# Climbing with your hands: grab a wall or a ledge with a grip button and pull yourself up, hand over hand.
# b (normal), off
# SOMVR_CLIMB=off

# ---- fighting --------------------------------------------------------------------------------------------------------

# The bow: hold out your left hand, squeeze the right grip at it, pull back and let go to shoot. 1 (normal), 0
# SOMVR_BOW=0

# Orcs try to block or dodge your sword swings the way they do in the flat game. 1 (normal), 0, force (they always try)
# SOMVR_COMBAT_REACT=0

# Warnings when an orc attacks you: a warm glow on its weapon hand; from where you are not looking, a glow at that edge
# of your view, a buzz on that side and a warning sound. 1 (normal), 0
# SOMVR_THREAT=0

# ---- feel ---------------------------------------------------------------------------------------------------------------

# Controller buzz strength in percent (normal 100; 0 = no buzz). 0 to 150
# SOMVR_HAPTICS=50

# The game's own rumble (as a gamepad would rumble) on the controllers. 1 (normal), 0
# SOMVR_RUMBLE=0

# How long an orc freezes when a heavy hit lands, in milliseconds (normal 120; 0 = no freeze). 0 to 500
# SOMVR_HITSTOP_MS=0

# ---- comfort options (all off unless you want them; the wrist menu has them too) ---------------------------------------

# Dark edges round your view while the stick moves or turns you. 0 = none (normal), 1 = strong. 0 to 1
# SOMVR_VIGNETTE=0.4

# A short black blink at each snap turn, in milliseconds (normal 0 = none; 140 is a quick one). 0 to 500
# SOMVR_SNAP_BLINK_MS=140

# Seated play: your view is put at Talion's standing eye height each time you recentre. 0 (normal), 1
# SOMVR_SEATED=1

# With seated play: your eye height above the floor in cm (normal: where your head is when you recentre). 100 to 220
# SOMVR_HEIGHT_CM=120

# ---- picture ---------------------------------------------------------------------------------------------------------

# Your eyes' height in Talion's head, in cm up (+) or down (-) (normal 0). -30 to 30
# SOMVR_EYE_CM=4

# The picture size per eye: xr = what the headset asks for (normal); WxH = that size (e.g. 1832x2015); off = the
# game's own size (softer). xr, WxH, xr,WxH, off
# SOMVR_EYE_SIZE=off

# An extra margin round the picture, so no black bars show at the edges when you turn your head fast (normal 0.1;
# 0 = none). 0 to 0.5
# SOMVR_OVERSCAN=0.2
